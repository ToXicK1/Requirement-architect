name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: ra_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,postgres]" pip-audit bandit
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest -q
      - name: Same tests on PostgreSQL
        env: {TEST_DATABASE_URL: "postgresql+asyncpg://postgres:ci@localhost:5432/ra_test"}
        run: pytest -q --ignore=tests/integration/test_migrations.py
      - run: bandit -q -r src -ll
      - run: pip-audit --progress-spinner off
