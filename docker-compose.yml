# Single-instance deployment (jobs, rate limits and locks are in-process: do NOT scale `api`).
# Put a TLS-terminating reverse proxy in front; the API port is bound to localhost only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: requirements_architect
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ra"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ra:${POSTGRES_PASSWORD}@db:5432/requirements_architect
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [appdata:/data]
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
