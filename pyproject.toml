[project]
name = "requirements-architect"
version = "0.1.0"
description = "AI-powered requirements engineering: problem statement to implementation-ready documentation."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "structlog>=24.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "reportlab>=4.0",
]

[project.scripts]
requirements-architect = "requirements_architect.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "pypdf"]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"requirements_architect.agent" = ["prompts/*/*.md"]
"requirements_architect.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requirements_architect.generators.docs.pdf"]
disallow_subclassing_any = false  # ReportLab is untyped
